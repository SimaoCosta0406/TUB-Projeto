<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUB Projeto - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <img src="transferir.png" class="logo" alt="Logo">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">Sobre</a></li>
                <li><a href="index.html#contact">Contacto</a></li>
                <li id="nav-login"><a href="login.html">Login</a></li>
                <li id="nav-logout" style="display: none;"><a href="#" onclick="fazerLogout()">Sair</a></li>
                <li><a href="mapa.html">Mapa</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container" id="login-form">
            <h2>Boas, faz o login</h2>
            <input type="email" id="emailInput" placeholder="Email (admin@tub.pt)" style="padding: 10px; margin-bottom: 10px;"><br>
            <input type="password" id="passwordInput" placeholder="Palavra-passe" style="padding: 10px; margin-bottom: 10px;"><br>
            <p id="erro-msg" style="color: #ff4d4d; display: none; margin-bottom: 10px;">Dados incorretos!</p>
            <button class="btn2" onclick="validarLogin()">LogIn</button>
        </div>

        <div class="container" id="login-success" style="display: none;">
            <h2 id="mensagem-boasvindas">Sessão Iniciada!</h2>
        </div>
    </section>

    </footer>
