spring.application.name=projeto
spring.datasource.url=jdbc:postgresql://192.168.233.121:5432/tub_pgu
spring.datasource.username=postgres
spring.datasource.password=igolina
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
server.address=0.0.0.0
# Desativar cache para ficheiros HTML (garante que o browser busca sempre a versão mais recente)
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
# Limitar pool de conexões ao PostgreSQL (evita "too many clients")
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
