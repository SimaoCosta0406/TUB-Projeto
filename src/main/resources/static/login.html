<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUB Projeto - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <img src="transferir.png" class="logo" alt="Logo TUB">
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#about">Sobre</a></li>
                <li><a href="index.html#contact">Contacto</a></li>
                <li id="nav-login"><a href="login.html">Login</a></li>
                <li id="nav-logout" style="display: none;"><a href="javascript:void(0)" onclick="fazerLogout()">Sair</a></li>
                <li id="nav-alarmes" style="display: none;">
                    <a href="javascript:void(0)" onclick="mostrarSecao('alarmes')">Alarmes</a>
                </li>
            </ul>
        </div>
    </nav>

    <section class="login-section">
        <div class="login-card">
            <h2>Bem-vindo</h2>
            <p>Entra na tua conta TUB para continuar.</p>

            <div class="form-group">
                <label for="emailInput">Email</label>
                <input type="email" id="emailInput" placeholder="email@tub.pt" />
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" />
            </div>

            <button class="btn-login" onclick="validarLogin()">Entrar</button>

            <div id="erro-msg">Email ou password incorretos.</div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
