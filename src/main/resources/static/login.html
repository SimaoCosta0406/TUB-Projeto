<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUB Projeto - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <img src="transferir.png" class="logo" alt="Logo TUB">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="mapa.html">Mapa</a></li>
                <li id="nav-monitorizacao" style="display: none;"><a href="monitorizacao.html">Monitorização</a></li>
                <li id="nav-veiculos" style="display: none;"><a href="veiculos.html">Veículos</a></li>

            <p>Faça login para aceder ao sistema completo.</p>

            <!-- Botão Auth0 -->
            <button id="btn-login-auth0" class="btn-login">

            </button>

            <div id="erro-msg" style="display: none; color: #ff5252; margin-top: 1rem; font-size: 0.9rem;">
                Erro ao autenticar. Tente novamente.
            </div>

            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: #666;">
                Visitante? <a href="index.html" style="color: #f5a623;">Voltar à Home</a>
            </p>
        </div>

    <!-- Auth0 SPA SDK -->
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script src="auth0-integration.js"></script>
    <script src="script.js"></script>
