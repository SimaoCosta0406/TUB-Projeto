spring:
  application:
    name: project

  datasource:
    url: jdbc:postgresql://db:5432/projetoDAI
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
